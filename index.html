<!DOCTYPE html>
<html lang="en">
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	
	<link rel="icon" type="image/x-icon" href="./images/icon-dark-theme.ico">
	<link rel="stylesheet" href="./style.css">
	<script src="./script.js"></script>
	<noscript>Your browser does not support JavaScript.</noscript>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Wikipedia Bingo</title>
</head>
<body>

<div class="container-fluid min-vh-100 d-flex flex-column" id="main-container">
	<div class="row">
		<div class="col">
			<h1>Wikipedia <span class="highlight-text">Bingo</span></h1>
		</div>
	</div>
	<div class="row flex-grow-1" id="game-row">

		<div class="col-md-6">
			<iframe
			id="wiki-frame"
			title="Random Wikipedia Page"
			src="https://en.wikipedia.org/wiki/Special:Random">
			</iframe>
			<img src="https://i.postimg.cc/nrmSsgJj/real-mao-quote.png" id="bingo-image" hidden="true">
		</div>

		<div class="col-md-6">

			<div class="container-fluid d-flex flex-column" id="bingo-board">
				<div class="row bingo-row" id="bingo-row-0">
					<div class="col bingo-space bingo-column-0" onclick="toggleSpace(0, 0);" data-selected="false">1</div>
					<div class="col bingo-space bingo-column-1" onclick="toggleSpace(0, 1);" data-selected="false">2</div>
					<div class="col bingo-space bingo-column-2" onclick="toggleSpace(0, 2);" data-selected="false">3</div>
					<div class="col bingo-space bingo-column-3" onclick="toggleSpace(0, 3);" data-selected="false">4</div>
					<div class="col bingo-space bingo-column-4" onclick="toggleSpace(0, 4);" data-selected="false">5</div>
				</div>
				<div class="row bingo-row" id="bingo-row-1">
					<div class="col bingo-space bingo-column-0" onclick="toggleSpace(1, 0);" data-selected="false">6</div>
					<div class="col bingo-space bingo-column-1" onclick="toggleSpace(1, 1);" data-selected="false">7</div>
					<div class="col bingo-space bingo-column-2" onclick="toggleSpace(1, 2);" data-selected="false">8</div>
					<div class="col bingo-space bingo-column-3" onclick="toggleSpace(1, 3);" data-selected="false">9</div>
					<div class="col bingo-space bingo-column-4" onclick="toggleSpace(1, 4);" data-selected="false">10</div>
				</div>
				<div class="row bingo-row" id="bingo-row-2">
					<div class="col bingo-space bingo-column-0" onclick="toggleSpace(2, 0);" data-selected="false">11</div>
					<div class="col bingo-space bingo-column-1" onclick="toggleSpace(2, 1);" data-selected="false">12</div>
					<div class="col bingo-space bingo-column-2" onclick="toggleSpace(2, 2);" data-selected="false">13</div>
					<div class="col bingo-space bingo-column-3" onclick="toggleSpace(2, 3);" data-selected="false">14</div>
					<div class="col bingo-space bingo-column-4" onclick="toggleSpace(2, 4);" data-selected="false">15</div>
				</div>
				<div class="row bingo-row" id="bingo-row-3">
					<div class="col bingo-space bingo-column-0" onclick="toggleSpace(3, 0);" data-selected="false">16</div>
					<div class="col bingo-space bingo-column-1" onclick="toggleSpace(3, 1);" data-selected="false">17</div>
					<div class="col bingo-space bingo-column-2" onclick="toggleSpace(3, 2);" data-selected="false">18</div>
					<div class="col bingo-space bingo-column-3" onclick="toggleSpace(3, 3);" data-selected="false">19</div>
					<div class="col bingo-space bingo-column-4" onclick="toggleSpace(3, 4);" data-selected="false">20</div>
				</div>
				<div class="row bingo-row" id="bingo-row-4">
					<div class="col bingo-space bingo-column-0" onclick="toggleSpace(4, 0);" data-selected="false">21</div>
					<div class="col bingo-space bingo-column-1" onclick="toggleSpace(4, 1);" data-selected="false">22</div>
					<div class="col bingo-space bingo-column-2" onclick="toggleSpace(4, 2);" data-selected="false">23</div>
					<div class="col bingo-space bingo-column-3" onclick="toggleSpace(4, 3);" data-selected="false">24</div>
					<div class="col bingo-space bingo-column-4" onclick="toggleSpace(4, 4);" data-selected="false">25</div>
				</div>

				<div class="row flex-grow-1" id="button-row">
					<button class="col" id="next-article-button" onclick="refreshWikiFrame()">Next Article</button>
					<button class="col" id="new-board-button" onclick="makeBingoBoard()">New Bingo Board</button>
				</div>

			</div>
		</div>
	</div>
</div>

</body>
</html>
