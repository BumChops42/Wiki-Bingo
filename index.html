<!DOCTYPE html>
<html lang="en">
<head>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	
	<link rel="icon" type="image/x-icon" href="./images/icon-dark-theme.ico">
	<link rel="stylesheet" href="./style.css">
	<script src="./script.js"></script>
	<noscript>Your browser does not support JavaScript.</noscript>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Wikipedia Bingo</title>
</head>
<body>

<div class="container-fluid min-vh-100 d-flex flex-column" id="main-container">
	<div class="row">
		<div class="col">
			<h1>Wikipedia <span class="highlight-text">Bingo</span></h1>
		</div>
	</div>
	<div class="row flex-grow-1" id="game-row">

		<div class="col-md-6">
			<iframe
			id="wiki-frame"
			title="Random Wikipedia Page"
			src="https://en.wikipedia.org/wiki/Special:Random">
			</iframe>
		</div>

		<div class="col-md-6">

			<div class="container-fluid d-flex flex-column" id="bingo-board">
				<div class="row bingo-row-0">
					<div class="col bingo-space bingo-column-0">1</div>
					<div class="col bingo-space bingo-column-1">2</div>
					<div class="col bingo-space bingo-column-2">3</div>
					<div class="col bingo-space bingo-column-3">4</div>
					<div class="col bingo-space bingo-column-4">5</div>
				</div>
				<div class="row bingo-row-1">
					<div class="col bingo-space bingo-column-0">6</div>
					<div class="col bingo-space bingo-column-1">7</div>
					<div class="col bingo-space bingo-column-2">8</div>
					<div class="col bingo-space bingo-column-3">9</div>
					<div class="col bingo-space bingo-column-4">10</div>
				</div>
				<div class="row bingo-row-2">
					<div class="col bingo-space bingo-column-0">11</div>
					<div class="col bingo-space bingo-column-1">12</div>
					<div class="col bingo-space bingo-column-2">13</div>
					<div class="col bingo-space bingo-column-3">14</div>
					<div class="col bingo-space bingo-column-4">15</div>
				</div>
				<div class="row bingo-row-3">
					<div class="col bingo-space bingo-column-0">16</div>
					<div class="col bingo-space bingo-column-1">17</div>
					<div class="col bingo-space bingo-column-2">18</div>
					<div class="col bingo-space bingo-column-3">19</div>
					<div class="col bingo-space bingo-column-4">20</div>
				</div>
				<div class="row bingo-row-4">
					<div class="col bingo-space bingo-column-0">21</div>
					<div class="col bingo-space bingo-column-1">22</div>
					<div class="col bingo-space bingo-column-2">23</div>
					<div class="col bingo-space bingo-column-3">24</div>
					<div class="col bingo-space bingo-column-4">25</div>
				</div>

				<button id="next-article-button">Next Article</button>

			</div>
		</div>
	</div>
</div>

</body>
</html>
